const bg=s=>{const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o};
let IX=null;
function index(){IX={qa:D.qa.map(x=>({x,Q:bg(nz(x.q)),A:bg(nz(x.a))})),cases:D.cases.map(c=>({x:c,Q:bg(nz(c.title)),A:bg(nz([c.sit,(c.did||[]).join(' '),c.res,c.type,c.dept].join(' ')))})),   // 사례 색인 = 제목 + 상황·한 일·결과
  bd:Object.keys(D.bd).map(k=>({x:k,Q:bg(nz(D.bd[k].title)),A:bg(nz(D.bd[k].ref||''))}))}}
function hits(B,list){return list.map(e=>{let a=0,b=0;B.forEach(t=>{if(e.Q.has(t))a++;else if(e.A.has(t))b++});return{x:e.x,s:(a+b*0.4)/B.size,a}}).filter(h=>h.s>=0.34&&h.a>=2).sort((p,q)=>q.s-p.s)}
function search(q){const B=bg(nz(q));if(B.size<2)return{qa:[],cases:[],bd:[]};
  const hq=hits(B,IX.qa).slice(0,2).map(h=>h.x),hc=hits(B,IX.cases).map(h=>h.x),hb=hits(B,IX.bd).map(h=>h.x);
  const cs=[...new Set(hc.map(c=>c.id).concat(...hq.map(x=>x.cases||[])))].filter(caseOf).slice(0,3);
  const bs=[...new Set([].concat(...hq.map(x=>x.bd||[]),...hc.map(c=>c.bd||[]),hb))].filter(k=>D.bd[k]).slice(0,3);
  return{qa:hq.map(x=>x.k),cases:cs,bd:bs}}

/* ── 공통 조각 ── */
function ansCard(k){const x=qaOf(k);if(!x)return '';return `<div class="an" data-qa="${A(k)}"><div class="aq"><span class="lbl">${E(KIND[x.t]||x.t)}</span><span>${E(x.q)}</span></div><div class="aa">${E(x.a)}</div></div>`}
function accItem(k){const x=qaOf(k);if(!x)return '';return `<div class="acc" data-qa="${A(k)}"><button class="acq" aria-expanded="false" onclick="accT(this)"><span class="lbl">${E(KIND[x.t]||x.t)}</span><span class="aqt">${E(x.q)}</span><span class="chev">+</span></button><div class="aca" hidden>${E(x.a)}</div></div>`}
function accT(el){const w=el.closest('.acc'),o=!w.classList.contains('open');w.classList.toggle('open',o);el.setAttribute('aria-expanded',o?'true':'false');w.querySelector('.aca').hidden=!o;el.querySelector('.chev').textContent=o?'−':'+'}
const lead=s=>{s=String(s||'');const m=s.match(/^.*?[.!?](?=\s|$)/);return m?m[0]:s};   // 상황 첫 문장(목록용)
/* 결과: 큰 숫자는 이후 값이 실적일 때만('이전 → 이후' 또는 이후 값 단독). 이후 값이 없으면(예측이라 비운 사례 등) 큰 숫자 없이 결과 글(원본 사실) + 설명 한 줄 — 이전 값이 성과처럼 크게 보이지 않게(11-27) */
function resBig(c,full){const note=c.res_note?`<div class="rn">${E(c.res_note)}</div>`:'';
  if(!c.res_to)return (full?`<p class="tx" id="res">${E(c.res)}</p>`:`<div class="r rs">${E(c.res)}</div>`)+note;
  return (c.res_label?`<div class="rl">${E(c.res_label)}</div>`:'')+`<div class="rb" data-res="1">${c.res_from?`<span class="rf">${E(c.res_from)}</span><span class="ra">→</span>`:''}<span class="rt">${E(c.res_to)}</span></div>`+note}
function caseBtn(id,mt){const c=caseOf(id);if(!c)return '';return `<button class="cs" data-case="${A(id)}" onclick="nav('${mk('case',{id})}')"><b>${E(c.title)}</b><div class="r">${E(lead(c.sit))}</div>${resBig(c)}${mt||''}</button>`}
function bdBtn(k,i){const b=D.bd[k];if(!b)return '';return `<button class="bdi" data-bd="${A(k)}" onclick="nav('${mk('bd',{k})}')"><span class="no">${i+1}</span><span class="sp">${E(b.title)}</span><span class="btn f">보기</span></button>`}
function featCard(n){const f=D.feat||[];if(!f.length)return '';return `<section class="cd sx" id="feat"><h3>${n?`<i>${n}</i>`:''}<span>${E(D.meta.feat_title)}</span></h3><ul class="why">${f.map(x=>`<li><span class="ck">✓</span><div class="wb"><div class="wt">${E(x.t)}</div><div class="wm"><span class="tg">${E(x.tag)}</span>${x.bd&&D.bd[x.bd]?`<button class="btn" data-bd="${A(x.bd)}" onclick="nav('${mk('bd',{k:x.bd})}')">BD 보기</button>`:''}</div></div></li>`).join('')}</ul></section>`}
/* 아래 고정 탭 — 사례 찾기 · 질문하기 · 내 질문(새 답 배지) · PM(답할 수 있는 계정만) */
function tabs(cur){const nb=MY&&MY.ok===1?MY.unseen||0:0,pw=PMD&&PMD.ok===1?PMD.wait||0:0;
  return `<nav class="tb" id="tb"><button id="tbhome" class="${cur==='home'?'on':''}" onclick="tabGo('home')"><i>⌕</i>사례 찾기</button><button id="tbask" class="${cur==='ask'?'on':''}" onclick="tabGo('q')"><i>?</i>질문하기</button>`
  +`<button id="gomy" class="${cur==='my'?'on':''}" onclick="tabGo('my')"><i>✉</i>내 질문<span class="badge${nb?'':' z'}" id="myn">${nb||''}</span></button>`
  +(ME.can?`<button id="gopm" class="${cur==='pm'?'on':''}" onclick="tabGo('pm')"><i>✎</i>PM 화면<span class="badge${pw?'':' z'}" id="pmn">${pw||''}</span></button>`:'')+`</nav>`}
function badges(){const n=$('myn');if(n&&MY&&MY.ok===1){n.textContent=MY.unseen?String(MY.unseen):'';n.classList.toggle('z',!MY.unseen)}
  const p=$('pmn');if(p&&PMD&&PMD.ok===1){p.textContent=PMD.wait?String(PMD.wait):'';p.classList.toggle('z',!PMD.wait)}}
function tabGo(t){const r=route();if(t==='home'){if(r.v==='home'){window.scrollTo(0,0);return}nav('#home');return}
  if(t==='q'){if(r.v==='home'){qFocus();return}nav('#home?f=q');return}
  if(t==='my'){if(r.v!=='my')nav('#my');return}if(t==='pm'&&r.v!=='pm')nav('#pm')}
function qFocus(){const c=$('qcard');if(c){c.scrollIntoView({block:'start'});const q=$('q');if(q)q.focus({preventScroll:true})}}

/* ── 처음 화면: 안내 + 조건 고르기(고르기 전에는 사례를 그리지 않는다) + 질문하기 ── */
function vhome(){const p=SES.pick,n=selN(p);
  return head()+`<div class="wrap${n?' fxon':''}" id="home"><div class="hero" id="hero"><b>담당 거래처에 해당하는 조건을 고르면 맞는 사례를 추천해 드립니다</b><small>아는 조건만 골라도 됩니다. 딱 맞는 사례가 없으면 가까운 사례부터 보여 드립니다.</small></div>
  <div class="cd" id="pick">`+D.filters.map(f=>`<div class="fl">${E(f.label)}</div><div class="chips" data-g="${A(f.key)}">`+f.opts.map(o=>`<button class="ch${f.key==='t'?' tt':''}${p[f.key]===o?' on':''}" data-f="${A(f.key)}" data-v="${A(o)}" aria-pressed="${p[f.key]===o?'true':'false'}" onclick="pickSet(this)">${E(f.key==='t'?TL(o):o)}${f.key==='t'&&D.types[o]?`<small>${E(D.types[o])}</small>`:''}</button>`).join('')+`</div>`).join('')
  +`<button class="go" id="gorec" onclick="pickGo()"${n?'':' disabled'}>맞는 사례 보기<small id="gorecn">${n?'고른 조건 '+n+'개':'조건을 1개 이상 골라 주세요'}</small></button></div>
  <div class="cd" id="qcard"><h2>질문하기 <small>승인 자료에서 찾아 그대로 보여 드립니다. 없으면 담당 PM에게 문의할 수 있습니다</small></h2><textarea class="q" id="q" maxlength="300" placeholder="궁금한 점을 적어 주세요"></textarea><button class="go" id="qgo" onclick="askGo()">찾기</button><div class="ex">${(D.examples||[]).map(x=>`<button onclick="askEx(this)">${E(x)}</button>`).join('')}</div></div></div>
  <div class="fx" id="gofix"${n?'':' hidden'}><button class="go" id="gorec2" onclick="pickGo()">맞는 사례 보기<small id="gorecn2">${n?'고른 조건 '+n+'개':''}</small></button></div>`+tabs('home')}
function pickSet(el){const k=el.dataset.f,v=el.dataset.v;SES.pick[k]=SES.pick[k]===v?'':v;
  document.querySelectorAll(`#pick .ch[data-f="${k}"]`).forEach(b=>{const on=b.dataset.v===SES.pick[k];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
  const n=selN(SES.pick),g=$('gorec');g.disabled=!n;$('gorecn').textContent=n?'고른 조건 '+n+'개':'조건을 1개 이상 골라 주세요';
  $('gofix').hidden=!n;$('gorecn2').textContent=n?'고른 조건 '+n+'개':'';$('home').classList.toggle('fxon',!!n)}   // 조건이 1개 이상이면 아래 탭 바로 위에 같은 단추를 고정(스크롤 없이 누름)
function pickGo(){if(!selN(SES.pick))return;nav(mk('rec',SES.pick))}
function homeAfter(){srv('atkmy',{}).then(r=>{if(r&&r.ok===1){MY=r;badges()}},()=>{});
  if(ME.can)srv('atkpm',{}).then(r=>{if(r&&r.ok===1){PMD=r;badges()}},()=>{});
  if(route().p.get('f')==='q')setTimeout(qFocus,0)}
function askEx(el){$('q').value=el.textContent;askGo()}
function askGo(){const el=$('q');if(!el)return;const q=el.value.trim().slice(0,300);if(!q)return;
  const res=search(q),s=++SES.seq,keys=res.qa.map(k=>'qa:'+k).concat(res.cases.map(k=>'case:'+k),res.bd.map(k=>'bd:'+k));
  const rec={q,res,qid:'',ctx:ctxNow()};SES.asks[s]=rec;
  rec.qp=srv('atkq',{rid:newRid(),q,n:res.qa.length,sh:keys.join(',').slice(0,200),ctx:rec.ctx}).then(r=>{if(r&&r.ok===1)rec.qid=r.qid;return rec.qid},()=>'');   // 질문 확정 1번 = 기록 1번
  nav(mk('ask',{q,s}))}

/* ── 질문 결과(질문을 했으므로 관련 요약사례를 보여도 된다) — 맨 끝에 특장점 ── */
function vask(){const p=route().p,q=(p.get('q')||'').slice(0,300),rec=SES.asks[p.get('s')]&&SES.asks[p.get('s')].q===q?SES.asks[p.get('s')]:{q,res:search(q),qid:'',ctx:'질문하기'};
  const r=rec.res,has=r.qa.length>0;
  const pmBox=`<div class="cd" id="pmask"><h2>${has?'찾는 답이 아니면 담당 PM에게 문의':'담당 PM에게 문의'} <small>답이 오면 '내 질문'에 표시됩니다</small></h2><textarea class="ta" id="pmq" maxlength="300"></textarea><button class="go" id="pmgo" data-s="${A(p.get('s')||'')}" onclick="pmAsk(this)">담당 PM에게 문의 보내기</button><div class="fbm" id="pmmsg"></div></div>`;
  const cs=r.cases.length?`<div class="cd" id="rcases"><h2>관련 요약사례</h2>${r.cases.map(id=>caseBtn(id)).join('')}</div>`:'';
  const bs=r.bd.length?`<div class="cd" id="rbd"><h2>관련 BD</h2>${r.bd.map((k,i)=>bdBtn(k,i)).join('')}</div>`:'';
  return head(1)+`<div class="wrap" id="ask"><div class="pq"><small>질문</small>${U(q)}</div>`+(has?`<div class="cd" id="hits"><h2>답 <small>승인 자료 원문 그대로</small></h2>${r.qa.map(ansCard).join('')}</div>`+cs+bs+pmBox
    :`<div class="miss" id="miss">등록된 자료에서 답을 찾지 못했습니다.</div>`+pmBox+cs+bs)+`<button class="go s" id="askagain" onclick="tabGo('q')">다른 질문하기</button><div style="height:12px"></div>`+featCard(0)+`</div>`+tabs('ask')}
function askAfter(){const t=$('pmq');if(t)t.value=(route().p.get('q')||'').slice(0,300)}
async function pmAsk(el){if(el.disabled)return;const s=el.dataset.s,rec=SES.asks[s],q=$('pmq').value.trim().slice(0,300),m=$('pmmsg');
  if(q.length<2){m.className='fbm bad';m.textContent='질문을 적어 주세요.';return}
  el.disabled=true;m.className='fbm';m.textContent='보내는 중…';
  let qid='',n=null;if(rec){qid=await Promise.race([rec.qp,sleep(15000).then(()=>rec.qid)]);n=rec.res.qa.length}   // 이 질문 기록 번호(qid)를 같이 — 판정이 '답 부족'/'답 없음'으로
  const p={q,ctx:rec?rec.ctx:ctxNow()};if(qid)p.qid=qid;if(n!=null)p.n=n;
  const sig=JSON.stringify(p);if(el.__sig!==sig){el.__sig=sig;el.__rid=newRid()}
  let r=null,e=null;try{r=await srv('atkask',Object.assign({rid:el.__rid},p))}catch(x){e=x}
  if(r&&r.ok===1){MY=null;m.className='fbm ok';m.textContent=(r.dup?'이미 접수된 질문입니다':'접수됨')+' — 문의 '+(r.id||'')+(r.mailfail?' · '+(r.msg||''):'')+" · 답이 오면 '내 질문'에 표시됩니다.";el.textContent='보냈습니다';return}
  el.disabled=false;m.className='fbm bad';m.textContent=errMsg(r,e)}

/* ── 추천 결과(조건을 1개 이상 고른 때만 — 없으면 처음 화면으로) ── */
function rstate(){const p=route().p,st={};D.filters.forEach(f=>{const v=p.get(f.key)||'';st[f.key]=f.opts.includes(v)?v:''});return st}
function recLabel(st){return D.filters.map(f=>st[f.key]).filter(Boolean).join('·')||'조건 없음'}
function minfo(c,st){const m=[],x=[];let s=0;D.filters.forEach(f=>{if(!st[f.key])return;if((c.f[f.key]||[]).includes(st[f.key])){m.push(f.key);s+=(D.weights[f.key]||1)}else x.push(f.key)});return{m,x,s}}
function ranked(st){const sel=selN(st);return D.cases.map((c,i)=>Object.assign({c,i},minfo(c,st))).sort((a,b)=>b.s-a.s||a.i-b.i).map(e=>Object.assign(e,{exact:sel>0&&e.x.length===0}))}
let REC_LAST=null;
const NEAR_N=(ex)=>ex?3:5;   // 가까운 사례는 처음에 딱 맞는 사례가 있으면 3건, 없으면 5건만 — 나머지는 [가까운 사례 더 보기]
function vrec(){const st=rstate(),R=ranked(st),ex=R.filter(e=>e.exact),show=ex.length+NEAR_N(ex.length);SES.lastRec=recLabel(st);REC_LAST={st,ids:R.slice(0,show).map(e=>e.c.id)};   // atkrec ks = 처음 화면에 보인 사례만
  const lab=k=>(D.filters.find(f=>f.key===k)||{}).label||k;
  const mt=e=>`<div class="chips mts" data-m="${A(e.m.join(','))}" data-x="${A(e.x.join(','))}">${e.m.map(k=>`<span class="mt y">✓ ${E(lab(k))}</span>`).join('')}${e.x.map(k=>`<span class="mt n">✕ ${E(lab(k))}</span>`).join('')}</div>`;
  let h=head(1)+`<div class="wrap" id="rec"><div class="cd" id="rsum"><div class="fl">고른 조건</div><div class="chips">${D.filters.filter(f=>st[f.key]).map(f=>`<span class="tag g" data-f="${A(f.key)}">${E(f.label)} · ${E(f.key==='t'?TL(st[f.key]):st[f.key])}</span>`).join('')}</div><button class="go s" id="chg" onclick="recChange()">조건 바꾸기</button></div>`;
  if(ex.length)h+=`<div class="note" id="rnote">조건에 딱 맞는 사례 ${ex.length}건${ex.length<R.length?' · 그 아래는 가까운 사례':''}</div>`;
  else h+=`<div class="note" id="rnote" data-near="1">딱 맞는 사례는 없습니다 — 가까운 사례부터(${D.filters.filter(f=>f.key!=='t').sort((a,b)=>(D.weights[b.key]||0)-(D.weights[a.key]||0)).map(f=>E(f.label)+' 일치').join(' > ')})</div>`;
  const card=(e,j)=>(ex.length&&j===ex.length?`<div class="sec" id="rnear">가까운 사례</div>`:'')+caseBtn(e.c.id,mt(e));
  h+=`<div id="rlist">`+R.slice(0,show).map(card).join('')+(R.length>show?`<div id="rmore" hidden>${R.slice(show).map((e,j)=>card(e,j+show)).join('')}</div><button class="go s" id="rmorebtn" onclick="recMore()">가까운 사례 더 보기 (${R.length-show}건)</button>`:'')+`</div>`;
  const pool=R.filter(e=>e.s>0).slice(0,3).map(e=>e.c),pl=pool.length?pool:R.slice(0,1).map(e=>e.c);
  let qs=st.cp?D.qa.filter(x=>(x.fam||[]).includes(st.cp)).map(x=>x.k):[];
  pl.forEach(c=>qs=qs.concat(c.qa||[]));qs=[...new Set(qs)].filter(notTalk).slice(0,2);
  let bs=[];qs.forEach(k=>bs=bs.concat(qaOf(k).bd||[]));pl.forEach(c=>bs=bs.concat(c.bd||[]));bs=[...new Set(bs)].filter(k=>D.bd[k]).slice(0,3);
  if(qs.length)h+=`<div class="cd" id="rqa"><h2>이 조건에서 나오는 질문 <small>눌러서 답 보기 · 승인 자료 원문 그대로</small></h2>${qs.map(accItem).join('')}</div>`;
  if(bs.length)h+=`<div class="cd" id="rbd"><h2>관련 BD</h2>${bs.map((k,i)=>bdBtn(k,i)).join('')}</div>`;
  return h+`</div>`+tabs('home')}
function recMore(){const m=$('rmore'),b=$('rmorebtn');if(m)m.hidden=false;if(b)b.remove()}
function recChange(){SES.pick=Object.assign({},rstate());nav('#home')}
/* 추천 기록(atkrec) — 추천 결과가 그려질 때 1번, 이 화면 세션에서 같은 조건이면 다시 보내지 않는다. 실패해도 화면은 그대로 */
function recLog(){if(!REC_LAST)return;const ctx=recLabel(REC_LAST.st).slice(0,80);if(SES.rec[ctx])return;SES.rec[ctx]=1;
  try{Promise.resolve(srv('atkrec',{rid:newRid(),ks:REC_LAST.ids.slice(0,10).join(','),ctx})).catch(()=>{})}catch(e){}}

/* ── 요약사례 상세: ① 상황 ② 한 일 ③ 결과 ④ 처방명분 근거 ⑤ 표준대화 ⑥ 관련 BD ⑦ 여기서 나오는 질문 ⑧ 특장점(맨 아래) ── */
function vcase(id){const c=caseOf(id);if(!c)return head(1)+`<div class="msg0">사례를 찾지 못했습니다.</div>`;
  const bds=(c.bd||[]).filter(k=>D.bd[k]),cq=(c.qa||[]).filter(notTalk).slice(0,5);let n=0;const no=()=>`<i>${++n}</i>`;
  const jn=[['s-sit','상황'],['s-why','근거'],['talk','표준대화']].concat(bds.length?[['cbd','BD']]:[],cq.length?[['cqa','질문']]:[]);
  return head(1)+`<div class="wrap" id="case" data-id="${A(c.id)}"><div class="cd ct"><h2 id="ctitle">${E(c.title)}</h2><div class="chips"><span class="tag g">${E(TL(c.type))}</span><span class="tag g">${E(c.cust)}</span>${c.dept?`<span class="tag g">${E(c.dept)}</span>`:''}</div>
  <div class="jn" id="jn">${jn.map(([i,l])=>`<button data-go="${i}" onclick="jump(this)">${l}</button>`).join('')}</div></div>
  <section class="cd sx" id="s-sit"><h3>${no()}<span>상황</span></h3><p class="tx" id="sit">${E(c.sit)}</p></section>
  <section class="cd sx" id="s-did"><h3>${no()}<span>한 일 <small>이 순서로 따라 해 보세요</small></span></h3><ol class="did" id="did">${(c.did||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ol></section>
  <section class="cd sx" id="s-res"><h3>${no()}<span>결과</span></h3>${resBig(c,1)}</section>
  <section class="cd sx" id="s-why"><h3>${no()}<span>처방명분 근거 <small>확인된 자료만 싣습니다 · 약가는 의약품안전나라 표시 상한금액 기준</small></span></h3><ul class="why" id="why">${(c.why||[]).map(w=>`<li><span class="ck">✓</span><div class="wb"><div class="wt">${E(w.t)}</div><div class="wm"><span class="tg">${E(w.tag)}</span>${w.bd&&D.bd[w.bd]?`<button class="btn" data-bd="${A(w.bd)}" onclick="nav('${mk('bd',{k:w.bd})}')">BD 보기</button>`:''}</div></div></li>`).join('')}</ul></section>
  <section class="cd sx" id="talk"><h3>${no()}<span>표준대화 <small>원장님께 이렇게 말씀드립니다</small></span></h3><div class="msg" id="talkt">${E(c.talk)}</div><button class="go" id="cpy" data-l="표준대화 복사" onclick="copyTalk(this)">표준대화 복사</button></section>
  ${bds.length?`<section class="cd sx" id="cbd"><h3>${no()}<span>관련 BD <small>원장님께 보여 드릴 자료</small></span></h3>${bds.map((k,i)=>bdBtn(k,i)).join('')}</section>`:''}
  ${cq.length?`<section class="cd sx" id="cqa"><h3>${no()}<span>여기서 나오는 질문 <small>눌러서 답 보기 · 승인 자료 원문 그대로</small></span></h3>${cq.map(accItem).join('')}</section>`:''}
  ${featCard(++n)}</div>
  <div class="ab" id="ab"><button class="ab1" id="cpy2" data-l="표준대화 복사" onclick="copyTalk(this)">표준대화 복사</button><button class="ab2" id="fbgo" onclick="fbOpen()">써 봤어요<span class="badge${SES.fbN[c.id]?'':' z'}" id="fbn">${SES.fbN[c.id]||''}</span></button></div>
  <div class="sh" id="fbs" hidden><div class="shb" onclick="fbClose()"></div><div class="shp fb" data-t="case" data-k="${A(c.id)}" role="dialog" aria-label="써 봤어요"><div class="shh"><b>써 봤어요</b><button class="x" onclick="fbClose()">닫기</button></div><div id="fbin">${fbForm(c.id)}</div></div></div>`}
function jump(el){const t=$(el.dataset.go);if(t)t.scrollIntoView({block:'start',behavior:'smooth'})}
function copyTalk(el){const c=caseOf(route().p.get('id'));if(!c)return;const s=c.talk,l=el.dataset.l||'표준대화 복사';
  const ok=()=>{el.textContent='복사됨 ✓';setTimeout(()=>{el.textContent=l},1500)};
  const old=()=>{const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand('copy')}catch(e){}ta.remove();r?ok():alert('복사하지 못했습니다. 글을 길게 눌러 직접 복사해 주세요.')};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(ok,old);else old()}

/* ── 써 봤어요(사례 상세에만) — 같은 사례에 다른 거래처 결과를 여러 번(새 rid) ── */
function fbForm(id){const n=SES.fbN[id]||0;return `<p class="tx sm" style="margin-top:0">이 사례를 거래처에 써 본 결과를 골라 주세요.${n?' (이 사례로 남긴 결과 '+n+'건)':''}</p><div class="opts">${['처방 약속 받음','검토 중','거절'].map((s,i)=>`<button class="opt" data-r="${i+1}" onclick="fbPick(this)">${s}</button>`).join('')}</div><input class="ln" maxlength="100" placeholder="한 줄(선택 · 100자)"><button class="go" id="fbsend" onclick="fbSend(this)">남기기</button><div class="fbm st0"></div>`}
function fbOpen(){const s=$('fbs');if(!s)return;s.hidden=false;document.body.style.overflow='hidden'}
function fbClose(){const s=$('fbs');if(!s)return;s.hidden=true;document.body.style.overflow=''}
function fbPick(el){el.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===el));const w=el.closest('.fb'),m=w&&w.querySelector('.st0');if(m&&m.classList.contains('bad')){m.className='fbm st0';m.textContent=''}}   // 고르면 '결과를 골라 주세요' 지움
async function fbSend(el){const w=el.closest('.fb'),o=w.querySelector('.opt.on'),m=w.querySelector('.st0');if(el.disabled)return;if(!o){m.className='fbm st0 bad';m.textContent='결과를 골라 주세요.';return}
  const p={t:w.dataset.t,k:w.dataset.k,r:+o.dataset.r,m:w.querySelector('input').value.trim().slice(0,100),ctx:ctxNow()};
  const sig=JSON.stringify(p);if(w.__sig!==sig){w.__sig=sig;w.__rid=newRid()}   // 같은 내용으로 다시 누르면 같은 요청(rid 그대로 — 서버가 한 번만 처리)
  el.disabled=true;m.className='fbm st0';m.textContent='보내는 중…';let r=null,e=null;
  try{r=await srv('atkfb',Object.assign({rid:w.__rid},p))}catch(x){e=x}
  if(r&&r.ok===1){const n=SES.fbN[p.k]=(SES.fbN[p.k]||0)+1;w.__sig=null;w.__rid=null;
    const b=$('fbn');if(b){b.textContent=String(n);b.classList.remove('z')}
    put($('fbin'),`<div class="done" id="fbdone">결과를 남겼습니다 ✓</div><p class="tx sm">이 사례로 남긴 결과 ${n}건 · 다른 거래처에서 써 보셨다면 한 번 더 남길 수 있습니다.</p><button class="go s" id="fbmore" onclick="fbMore()">다른 거래처 결과 더 남기기</button><button class="go" onclick="fbClose()">닫기</button>`);return}
  el.disabled=false;m.className='fbm st0 bad';m.textContent=errMsg(r,e)}
function fbMore(){const w=document.querySelector('#fbs .fb');if(!w)return;w.__sig=null;w.__rid=null;put($('fbin'),fbForm(w.dataset.k))}

/* ── BD 보기 — 화면 폭에 맞춰 보이고, 누르면 원본 크기(가로로 밀어서 보기) ── */
let VB=null;
function vbd(){const p=route().p,k=p.get('k'),b=D.bd[k];if(!b)return head(1)+`<div class="msg0">BD를 찾지 못했습니다.</div>`;
  const n=b.pages||1,pg=Math.min(Math.max(+p.get('p')||1,1),n);VB={k,pg,n};
  return `<div class="vw" id="viewer" data-key="${A(k)}"><div class="vt"><button class="b" aria-label="뒤로" onclick="backTo('#home')">←</button><b>${E(b.title)}</b><a class="b f" id="pdf" href="${A(bdPdfHref(k))}" download="${A(b.file||k)}.pdf" data-k="${A(k)}" onclick="return bdPdf(this)">PDF 받기</a></div>
  <div class="vb" id="vb"><div class="ld" id="bdld"><i></i>BD를 불러오는 중…</div><img id="bdimg" alt="${A(b.title)}" onclick="bdZoom()" onload="this.dataset.ok='1';bdDone()" onerror="bdFail(this)"></div>
  <div class="vf"><button onclick="step(-1)"${pg<=1?' disabled':''}>← 이전</button><button class="f" id="zoom" onclick="bdZoom()">크게 보기</button><button onclick="step(1)"${pg>=n?' disabled':''}>다음 →</button></div></div>`}
function bdZoom(){const v=$('vb'),z=$('zoom');if(!v)return;const on=!v.classList.contains('zm');v.classList.toggle('zm',on);if(z)z.textContent=on?'화면에 맞추기':'크게 보기'}
function bdDone(){const l=$('bdld');if(l)l.remove()}
function bdFail(el,e){if(el.dataset.ok==='0')return;el.dataset.ok='0';bdDone();el.insertAdjacentHTML('afterend','<span class="err">'+E(e&&e.stale?e.message:'이미지를 불러오지 못했습니다')+'</span>')}
function fillBd(){const el=$('bdimg');if(!el||!VB)return;bdImg(VB.k,VB.pg).then(u=>{el.src=u},e=>bdFail(el,e))}
function step(d){if(!VB)return;const pg=VB.pg+d;if(pg<1||pg>VB.n)return;replace(mk('bd',{k:VB.k,p:pg}))}

/* ── 내 질문 ── */
const stLab=x=>x.st==='대기'?`<span class="st w">대기</span>`:`<span class="st a">${E(x.st)}</span>`;
function vmy(){return head(1)+`<div class="wrap" id="my"><div class="cd"><h2>내 질문 <small>담당 PM에게 문의한 것과 받은 답</small></h2><div id="mylist"><div class="msg0">불러오는 중…</div></div></div></div>`+tabs('my')}
function myItem(x,open){const nw=x.a&&!x.seen;
  return `<div class="it${open?' open':''}" data-id="${A(x.id)}"><button class="ih" onclick="myOpen(this)"><div class="iq">${stLab(x)}${nw?`<span class="badge">새 답</span> `:''}${U(x.q)}</div><div class="im">${E(x.id)} · ${U(x.at)}</div></button>
  ${open?`<div class="ib">${x.a?`<div class="ans">${U(x.a)}</div><div class="im">답: ${U(x.by)} · ${U(x.aAt)}</div>`:`<div class="im" style="margin-top:8px">아직 답이 없습니다. 답이 오면 여기에 표시됩니다.</div>`}</div>`:''}</div>`}
let MYOPEN='';
function myDraw(){const L=$('mylist');if(!L)return;if(!MY||MY.ok!==1){put(L,`<div class="msg0">내 질문을 불러오지 못했습니다. <button class="btn" onclick="myLoad()">다시</button></div>`);return}
  badges();
  if(!MY.items.length){put(L,`<div class="msg0">아직 문의한 질문이 없습니다.</div>`);return}
  put(L,MY.items.map(x=>myItem(x,x.id===MYOPEN)).join(''));const o=L.querySelector('.it.open');if(o&&route().p.get('id'))o.scrollIntoView({block:'center'})}
function myLoad(){return srv('atkmy',{}).then(r=>{MY=r},()=>{MY=null}).then(()=>{const id=route().p.get('id');if(id&&!MYOPEN)MYOPEN=id;myDraw();const x=MY&&MY.items&&MY.items.find(y=>y.id===MYOPEN);if(x)mySeen(x)})}
function myOpen(el){if(!MY||!MY.items)return;const id=el.closest('.it').dataset.id;MYOPEN=MYOPEN===id?'':id;myDraw();const x=MY.items.find(y=>y.id===MYOPEN);if(x)mySeen(x)}
function mySeen(x){if(!x.a||x.seen||x.__seeing)return;x.__seeing=1;srv('atkseen',{rid:newRid(),id:x.id}).then(r=>{if(r&&r.ok===1){x.seen=1;x.seenAt=r.seenAt;if(MY)MY.unseen=Math.max(0,(MY.unseen||0)-1);myDraw()}},()=>{}).then(()=>{x.__seeing=0})}

/* ── PM 화면(답할 수 있는 계정만 — 아니면 atkpm을 부르지 않는다) ── */
let PMOPEN='';
function vpm(){if(!ME.can)return head(1)+`<div class="wrap"><div class="msg0" id="nopm">답할 수 있는 계정이 아닙니다.</div></div>`+tabs('pm');
  return head(1)+`<div class="wrap" id="pm"><div class="cd"><h2>받은 문의 <small>대기 먼저</small></h2><div id="pmlist"><div class="msg0">불러오는 중…</div></div></div><div class="cd"><h2>들어온 결과 <small>사례별 '써 봤어요'</small></h2><div id="fblist"></div></div></div>`+tabs('pm')}
function pmItem(x,open){return `<div class="it${open?' open':''}" data-id="${A(x.id)}"><button class="ih" onclick="pmOpen(this)"><div class="iq">${stLab(x)}${U(x.q)}</div><div class="im">${E(x.id)} · ${U(x.name||x.email)}${x.org?' · '+U(x.org,'org'):''} · ${U(x.at)}${x.ctx?' · '+U(x.ctx):''}</div></button>
  ${open?`<div class="ib">${roleKey(x.role)==='업체'?`<div class="note vq">업체 질문 — 답이 그대로 업체 화면에 보입니다</div>`:''}${x.a?`<div class="ans">${U(x.a)}</div><div class="im">답: ${U(x.by)} · ${U(x.aAt)}</div>`:''}<textarea class="ta" maxlength="2000" placeholder="답을 적어 주세요(질문자 화면에 그대로 보입니다 — 사내 정보·사람 이름은 적지 않습니다)"${PMSEND[x.id]?' readonly':''}></textarea><div class="row"><button class="btn f" onclick="pmSend(this)"${PMSEND[x.id]?' disabled':''}>${x.a?'답 고치기':'답 보내기'}</button></div><div class="fbm pmm">${PMSEND[x.id]?'보내는 중… 반영을 확인하고 있습니다':''}</div></div>`:''}</div>`}
/* 목록을 다시 그려도(늦게 온 atkpm 등) 쓰던 답 글·보내는 중 상태는 그대로 — PMDRAFT[문의 번호] = 쓰던 글, PMSEND[문의 번호] = 보내는 중 */
const PMDRAFT={},PMSEND={};
function pmDraw(){const L=$('pmlist'),F=$('fblist');if(!L)return;L.querySelectorAll('.it.open textarea').forEach(t=>{const id=t.closest('.it').dataset.id;if(id&&!t.readOnly)PMDRAFT[id]=t.value});if(!PMD||PMD.ok!==1){put(L,`<div class="msg0">${PMD&&PMD.err==='no_role'?'답할 수 있는 계정이 아닙니다.':'목록을 불러오지 못했습니다.'} <button class="btn" onclick="pmLoad()">다시</button></div>`);return}
  badges();
  if(!PMD.items.length)put(L,`<div class="msg0">받은 문의가 없습니다.</div>`);else put(L,PMD.items.map(x=>pmItem(x,x.id===PMOPEN)).join(''));
  const o=L.querySelector('.it.open');if(o){const t=o.querySelector('textarea'),x=PMD.items.find(y=>y.id===PMOPEN);if(t&&x)t.value=PMDRAFT[x.id]!=null?PMDRAFT[x.id]:(x.a||'');if(route().p.get('id'))o.scrollIntoView({block:'center'})}
  else if(PMOPEN&&route().p.get('id')===PMOPEN)L.insertAdjacentHTML('afterbegin',`<div class="note" id="pmnf">문의 ${E(PMOPEN)}를 목록에서 찾지 못했습니다.</div>`);
  if(F)put(F,(PMD.fb||[]).length?PMD.fb.map(f=>{const c=f.t==='case'?caseOf(f.k):null;return `<div class="fbl" data-k="${A(f.k)}"><b>${U(f.rl)}</b> · ${c?E(c.title):U(f.t+' '+f.k)}${f.m?' — '+U(f.m):''}<div class="im">${U(f.name||f.email)}${f.org?' · '+U(f.org,'org'):''} · ${U(f.at)}${f.ctx?' · '+U(f.ctx):''}</div></div>`}).join(''):`<div class="msg0">아직 없습니다.</div>`)}
function pmLoad(){if(!ME.can)return Promise.resolve();return srv('atkpm',{}).then(r=>{PMD=r},()=>{PMD=null}).then(()=>{const id=route().p.get('id');if(id&&!PMOPEN)PMOPEN=id;pmDraw()})}
function pmOpen(el){const id=el.closest('.it').dataset.id;PMOPEN=PMOPEN===id?'':id;pmDraw()}
const cleanA=v=>String(v==null?'':v).replace(/\r\n?/g,'\n').replace(/[\x00-\x09\x0b-\x1f\x7f]+/g,' ').replace(/\n{3,}/g,'\n\n').trim().slice(0,2000);   // 서버(atkAnsText_)와 같은 정리
/* 답 쓰기: POST(응답은 못 읽는다고 보고) → atkpm을 2·6·15초에 다시 불러 aAt가 바뀌고 답이 같으면 반영. 안 되면 같은 rid로 다시 POST(서버가 두 번 쓰지 않음). 모두 3번 */
async function sendAnswer(id,text,before,prevA){const rid=newRid(),want=cleanA(text),W=window.__atkWait||[2000,6000,15000],chg=cleanA(prevA)!==want;   // 답 글이 바뀐 경우는 글이 같아지면 반영(답한 시각이 같은 초여도), 같은 글을 다시 보낸 경우는 답한 시각이 바뀌어야 반영
  for(let k=0;k<3;k++){try{await ansPost({rid,id,a:text})}catch(e){if(e&&e.gate)throw e}
    for(const w of W){await sleep(w);let r=null;try{r=await srv('atkpm',{})}catch(e){if(e&&e.gate)throw e;continue}
      if(!r||r.ok!==1)continue;const it=r.items.find(x=>x.id===id);if(it&&it.aAt&&cleanA(it.a)===want&&(chg||it.aAt!==before)){PMD=r;return it}}}
  throw new Error('반영을 확인하지 못했습니다')}
async function pmSend(el){if(el.disabled)return;const w=el.closest('.it'),id=w.dataset.id,t=w.querySelector('textarea'),m=w.querySelector('.pmm'),x=PMD.items.find(y=>y.id===id);
  const a=cleanA(t.value);if(a.length<2){m.className='fbm pmm bad';m.textContent='답을 2자 이상 적어 주세요.';return}
  const text=t.value;PMDRAFT[id]=text;PMSEND[id]=1;el.disabled=true;t.readOnly=true;m.className='fbm pmm';m.textContent='보내는 중… 반영을 확인하고 있습니다';
  const say=(cls,msg)=>{const w2=document.querySelector(`#pmlist .it[data-id="${id}"] .pmm`);if(w2){w2.className='fbm pmm '+cls;w2.textContent=msg}};   // 보내는 동안 목록이 다시 그려졌어도 지금 화면의 그 문의에
  try{const it=await sendAnswer(id,text,x?x.aAt:'',x?x.a:'');delete PMSEND[id];delete PMDRAFT[id];PMOPEN=id;pmDraw();say('ok','반영됨 — '+it.st+' · '+it.aAt)}
  catch(e){delete PMSEND[id];pmDraw();say('bad',e&&e.gate?'계정 확인이 필요합니다.':'반영을 확인하지 못했습니다. 잠시 뒤 목록을 새로 열어 확인하고, 없으면 다시 보내 주세요.')}}

function render(){
  if(!D)return;const r=route(),app=$('app');VB=null;document.body.style.overflow='';
  document.title=D.meta.title;
  if(r.v==='rec'&&!selN(rstate())){replace('#home');return}   // 조건 없이 추천 화면으로 오면 처음 화면(사례를 미리 보여 주지 않는다)
  if(r.v==='ask'){put(app,vask());askAfter()}
  else if(r.v==='rec'){put(app,vrec());recLog()}
  else if(r.v==='case')put(app,vcase(r.p.get('id')));
  else if(r.v==='bd'){put(app,vbd());fillBd()}
  else if(r.v==='my'){MYOPEN=r.p.get('id')||MYOPEN;put(app,vmy());if(MY&&MY.ok===1)myDraw();myLoad()}
  else if(r.v==='pm'){PMOPEN=r.p.get('id')||PMOPEN;put(app,vpm());if(ME.can){if(PMD&&PMD.ok===1)pmDraw();pmLoad()}}
  else{put(app,vhome());homeAfter()}
  window.scrollTo(0,0)}
if(!location.hash)history.replaceState(null,'','#home');
loadData().then(o=>{D=o.d;ME=meOf(o);SYN=(D.syn||[]).map(([p,f,v])=>[new RegExp(p,f),v]);STOP=new RegExp(D.stop||'$^','g');index();render()})
  .catch(e=>{if(e&&e.gate)return;const a=$('app');a.textContent='';const d=document.createElement('div');d.className='msg0';d.textContent='자료를 불러오지 못했습니다 ('+(e&&e.message||'')+'). '+LOAD_HELP;a.appendChild(d)});
</script>
</body>
</html>
