<div id="app"><div class="msg0">불러오는 중…</div></div>

<script>
'use strict';
/* ── 자료 받는 곳은 이 구간뿐(로컬 미리보기판) — 열람 게이트판은 빌더가 [ADAPTER] 구간을 src/adapter_gate.js로 갈아 끼운다 ── */
/*[ADAPTER:BEGIN] 열람 게이트판 */
/* 자료 받는 곳 — 열람 게이트판(빌더가 src/index.html의 [ADAPTER] 구간 자리에 넣는다). 토큰·계정 확인은 머리(gate_head.html)의 __gateTok·__gateGo·__gateGuard */
const LOAD_HELP='새로고침해도 같으면 담당자에게 알려 주세요.';
const PM_NOTE='PM 문의는 담당 PM에게 메일로 전달되고 접수 기록이 남습니다.';
let WHO_T='계정 확인 중';
function whoText(){return WHO_T}
let _cmN=0;
function gcall(doc,params,ms){return new Promise((res,rej)=>{ // D에 JSONP 1번 — 열람 거절이면 머리의 안내·재로그인으로
  const tok=window.__gateTok();
  if(!tok){window.__gateGo('no_token');const er=new Error('계정 확인이 필요합니다');er.gate=1;return rej(er)}
  const fn='__cm'+(++_cmN)+'_'+Date.now().toString(36),s=document.createElement('script');
  const end=()=>{clearTimeout(to);s.remove()};
  const to=setTimeout(()=>{end();window[fn]=function(){};rej(new Error('응답이 없습니다'))},ms||60000);
  window[fn]=r=>{end();try{delete window[fn]}catch(e){}
    if(r&&r.auth==='required'){window.__gateGuard(r);const er=new Error('열람 확인이 필요합니다');er.gate=1;return rej(er)} // 안내·재로그인은 머리가 한다
    res(r)};
  s.onerror=()=>{end();rej(new Error('서버에 연결하지 못했습니다'))};
  s.src=window.__DATA+'?doc='+doc+'&callback='+fn+Object.keys(params||{}).map(k=>'&'+k+'='+encodeURIComponent(params[k])).join('')+'&_='+Date.now()+'&tok='+encodeURIComponent(tok);
  document.head.appendChild(s)})}
function b64bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function loadData(){
  const r=await gcall('casemap',{},90000);
  if(!r||r.ok!==1||!r.d)throw new Error(r&&r.err==='no_data'?'자료가 아직 올라오지 않았습니다':'자료를 읽지 못했습니다');
  WHO_T=r.who||'';return r.d;
}
const _bdC=new Map(); // 받은 쪽 이미지는 이 화면이 열려 있는 동안 다시 받지 않는다
function bdImg(key,page){ // 쪽 이미지 주소(약속) — 화면이 그 쪽을 열 때만 서버에서 받는다
  const id=key+'|'+page;if(_bdC.has(id))return _bdC.get(id);
  const b=(D&&D.bd[key])||{};
  const pr=gcall('casemapbd',{k:b.fid||'',p:page},90000).then(r=>{if(!r||r.ok!==1||!r.b64)throw new Error('이미지 없음');return URL.createObjectURL(new Blob([b64bytes(r.b64)],{type:r.mime||'image/png'}))});
  _bdC.set(id,pr);pr.catch(()=>_bdC.delete(id));return pr;
}
function bdPdfHref(key){return '#'}
function bdPdf(a){ // PDF 받기 — 서버가 나눠 둔 조각을 3개씩 받아 이 기기에서 이어 붙인다. 조각 번호 이름은 i(GAS 웹앱은 c·sid가 예약어 — c로 보내면 400)
  if(a.dataset.busy)return false;
  const key=a.dataset.k,b=(D&&D.bd[key])||{},n=b.pdfn||0,label=a.textContent,parts=new Array(n);
  if(!n||!b.fid){alert('이 자료는 PDF가 없습니다.');return false}
  a.dataset.busy='1';let next=0,done=0;a.textContent='받는 중 0/'+n;
  const STALE='자료가 막 갱신되었거나 갱신 중입니다. 화면을 새로고침한 뒤 다시 받아 주세요';
  const one=i=>gcall('casemappdf',{k:b.fid,i:i},120000).then(r=>{if(r&&r.err==='no_file')throw new Error(STALE);if(!r||r.ok!==1||!r.b64)throw new Error('조각 '+(i+1)+' 없음');parts[i]=b64bytes(r.b64);a.textContent='받는 중 '+(++done)+'/'+n});
  const work=()=>next<n?one(next++).then(work):Promise.resolve();
  // 11-22 검토관 🔴: 이어 붙인 PDF를 자료의 sha256과 대조 — 옛·새 조각이 섞이면 저장하지 않고 새로고침 안내
  const check=()=>{if(!b.sha||!(window.crypto&&crypto.subtle))return Promise.resolve();let len=0;parts.forEach(p=>len+=p.length);
    if(b.size&&len!==b.size)return Promise.reject(new Error(STALE));const all=new Uint8Array(len);let o=0;parts.forEach(p=>{all.set(p,o);o+=p.length});
    return crypto.subtle.digest('SHA-256',all).then(h=>{const hx=Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');if(hx!==b.sha)throw new Error(STALE)})};
  Promise.all([work(),work(),work()]).then(check).then(()=>{
    const u=URL.createObjectURL(new Blob(parts,{type:'application/pdf'})),x=document.createElement('a');
    x.href=u;x.download=(b.file||key)+'.pdf';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)
  }).catch(e=>alert(e.message===STALE?STALE+'.':'PDF를 받지 못했습니다 ('+e.message+'). 잠시 뒤 다시 눌러 주세요.')).then(()=>{delete a.dataset.busy;a.textContent=label});
  return false;
}
function pmSend(q,ctx){ // PM 문의 — 서버가 기록 1행 + 담당 PM 메일 1통
  return gcall('casemapask',{q:String(q).slice(0,300),ctx:ctx||''},60000).then(r=>r&&r.ok===1?{ok:1,msg:(r.dup?'':'접수됨 — ')+(r.msg||'')}:{ok:0,msg:(r&&r.msg)||'보내지 못했습니다. 잠시 뒤 다시 눌러 주세요.'});
}
/*[ADAPTER:END]*/
/* ─────────────────────────────────────────────── */
let D=null,lastMap='#map';const stack=[];
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const A=s=>E(s); // 속성값
function route(){const h=location.hash.slice(1)||'map';const i=h.indexOf('?');return{v:i<0?h:h.slice(0,i),p:new URLSearchParams(i<0?'':h.slice(i+1))}}
function mk(v,o){const p=new URLSearchParams();Object.keys(o).forEach(k=>{if(o[k]!==''&&o[k]!=null)p.set(k,o[k])});const s=p.toString();return '#'+v+(s?'?'+s:'')}
function nav(h){stack.push(location.hash||'#map');location.hash=h}
function backTo(fb){if(stack.length)history.back();else location.hash=fb}
function replace(h){history.replaceState(null,'',h);render()}
addEventListener('hashchange',()=>{if(stack.length&&stack[stack.length-1]===location.hash)stack.pop();render()});

const typeOf=(t,c)=>{const s=D.sets.find(x=>x.key===t);return s&&s.classes?s.classes.find(k=>k.comps.includes(c.comp)):null};
const numTxt=v=>(/\d/.test(v)?'월 ':'')+v;
function head(back){return `<div class="hd">${back?`<button class="bk" onclick="backTo(lastMap)">← 사례 맵</button>`:''}<b>${E(D.meta.title)}</b><span class="sp"></span><span class="who">${E(whoText())}</span></div>`}

/* 1층 사례 맵 */
function mstate(){const p=route().p,ts=Object.keys(D.types);const t=ts.includes(p.get('t'))?p.get('t'):ts[0];const st={t};D.filters.forEach(f=>{const v=p.get(f.key)||'';st[f.key]=f.opts.includes(v)?v:''});st.q=p.get('q')||'';return st}
function pass(c,st){return D.filters.every(f=>!st[f.key]||(c.f[f.key]||[]).includes(st[f.key]))}
function setSt(st,k,v){const o=Object.assign({},st,{[k]:v,q:''});replace(mk('map',o))}
function row(c,t){
  const solo=D.solo_types.includes(t);
  // 유형 단독 묶음(solo_types)은 '과별 타겟 환자'가 중심(11-21 박본님, 출력묶음과 같은 배치): 왼쪽 = 거래처·과 + 타겟 환자, 상황은 가운데 칸 위
  const c1=solo?`<small class="who"><span class="bdg">${E(c.cust)}</span><b>${E(c.dept)}</b></small><div class="tg">${E(c.target||c.pt||'')}</div>`:`<b>${E(c.cshort)}</b><small><span class="bdg">${E(c.cust)}</span>${E(c.dept)}</small>`;
  return `<div class="row" data-id="${c.id}" onclick="nav('${mk('case',{id:c.id})}')"><div class="c1${solo?' solo':''}">${c1}</div><div class="c2">${solo&&c.sit?`<div class="sit">${E(c.sit)}</div>`:''}<div>${c.tags.map(g=>`<span class="tag">${E(g)}</span>`).join('')}</div><div class="one">${E(c.one)}</div></div>
  <div class="c3${c.r_pred?' p':''}"><div>${c.r_from?`<span class="f">월 ${E(c.r_from)} → </span>`:''}<span class="t">${E(numTxt(c.r_to))}</span></div><small>${E(c.r_note)}${c.r_pred?' · '+E(D.labels.pred):''}</small></div><div class="go">→</div></div>`}
function reasons(rs){return `<div class="rs">`+rs.map((r,i)=>{const j=r.indexOf(' — ');const x=j<0?r:r.slice(0,j),y=j<0?'':r.slice(j+3);return `<div><span>${i+1}</span><b>${E(x)}</b>${y?' — '+E(y):''}</div>`}).join('')+`</div>`}
function vmap(){
  const st=mstate(),t=st.t;lastMap=mk('map',Object.assign({},st,{q:''}));
  const all=D.cases.filter(c=>c.type===t),cs=all.filter(c=>pass(c,st));
  const td=D.types[t],j=td.indexOf(' → '),a=j<0?td:td.slice(0,j),b=j<0?'':td.slice(j+3);
  const nf=D.filters.filter(f=>st[f.key]).length;
  let h=head()+`<div class="wrap"><div class="side" id="side"><div class="tps">`+Object.keys(D.types).map(k=>{const n=D.cases.filter(c=>c.type===k&&pass(c,st)).length;const d=D.types[k];return `<div class="tp${k===t?' on':''}" data-t="${A(k)}" onclick="setSt(mstate(),'t',this.dataset.t)"><span class="n">${n}</span><b>${E(k)}</b><div>${E(d.split(' → ')[0])}</div></div>`}).join('')+`</div>
  <button class="ftg" onclick="$('side').classList.toggle('open')">거르기 ${nf?'('+nf+'개 적용) ':''}▾</button><div class="flt">`
  +D.filters.map(f=>`<div class="fl">${E(f.label)}</div><div class="chips"><span class="chip${st[f.key]?'':' on'}" onclick="setSt(mstate(),'${f.key}','')">전체</span>`+f.opts.map(o=>`<span class="chip${st[f.key]===o?' on':''}" data-v="${A(o)}" onclick="setSt(mstate(),'${f.key}',this.dataset.v)">${E(o)}</span>`).join('')+`</div>`).join('')
  +`</div><div class="fl">FAQ 질문하기</div><div class="fqb"><textarea id="fq" placeholder="궁금한 점을 적어 주세요"></textarea><button class="fqs" onclick="ask()">질문</button><div class="fqe">${(D.faq_examples||[]).map(x=>`<span onclick="ex(this)">${E(x)}</span>`).join('')}</div></div></div><div class="main" id="main">
  <div class="def"><span class="dtx">${E(a)} ${b?`<b>→ ${E(b)}</b>`:''}</span>${prBtns(t)}</div>`;
  const s=D.sets.find(x=>x.key===t)||{};
  if(!cs.length)h+=`<div class="none" id="none">해당 사례 없음</div>`;
  else if(s.classes){const used=new Set();s.classes.forEach(k=>{const g=cs.filter(c=>k.comps.includes(c.comp));if(!g.length)return;g.forEach(c=>used.add(c.id));h+=`<div><span class="cls">${E(k.name)}</span></div>`+reasons(k.reasons)+g.map(c=>row(c,t)).join('')});
    const rest=cs.filter(c=>!used.has(c.id));h+=rest.map(c=>row(c,t)).join('')}
  else{if(s.reasons_top&&s.reasons_top.reasons&&s.reasons_top.reasons.length)h+=`<div><span class="cls">${E(s.reasons_top.name)}</span></div>`+reasons(s.reasons_top.reasons);h+=cs.map(c=>row(c,t)).join('')}
  return h+`<div class="lock">사례를 누르면 상세(표준대화 · 근거 BD · FAQ)가 열립니다 — 등록된 계정만</div></div></div>`}

/* FAQ 찾기 — 시안 로직 그대로(사내 FAQ에서만 답, 답은 원문 그대로) */
const SYN=[[/같이|함께|동시|겸용|병행/g,'병용'],[/쎄레브렉스|세레브렉스|셀레콕시브|세레콕시브|콕시브|cox-?2/gi,'세레브렉스cox2'],[/타이레놀|아세트아미노펜/g,'타이레놀'],[/삭감|급여|보험|인정/g,'삭감'],[/나눠|쪼개|반알|반으로/g,'분할'],[/어린이|아이들|소아|청소년/g,'소아청소년'],[/하루두번|하루2번|1일2회/g,'bid']];
const STOP=/(써도|해도|먹어도|줘도|처방해도)?(되나요|돼요|되나|될까요|가능한가요|가능한지|가능해요|있나요|없나요|인가요|인지|뭐예요|뭔가요|무엇인가요|어떤|어떻게|알려줘|알려주세요|궁금|한테|에게|이랑|랑|하면)/g;
const nz=s=>{s=String(s).toLowerCase().replace(/\s/g,'');SYN.forEach(([r,v])=>s=s.replace(r,v));return s.replace(STOP,'').replace(/[^0-9a-z가-힣]/g,'')};
const bg=s=>{const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o};
function match(q){const B=bg(nz(q));if(B.size<2)return[];return D.faq.map(f=>{const Q=bg(nz(f.q)),A2=bg(nz(f.a));let a=0,b=0;B.forEach(x=>{if(Q.has(x))a++;else if(A2.has(x))b++});return{f,s:(a+b*0.4)/B.size,a}}).filter(x=>x.s>=0.34&&x.a>=2).sort((x,y)=>y.s-x.s).slice(0,2)}
let lastQ='';
function ask(){const el=$('fq');if(!el)return;const q=el.value.trim();if(!q)return;lastQ=q;const m=match(q),p=$('pop');
  p.innerHTML=`<div class="ph"><b>FAQ 답변</b><span onclick="closePop()">닫기</span></div><div class="pq">${E(q)}</div>`+(m.length?`<div id="faqhit">`+m.map(x=>`<div class="pa"><b>${E(x.f.q)}</b><div>${E(x.f.a)}</div></div>`).join('')+`</div><div class="ps">사내 FAQ에 있는 답 그대로입니다 · 찾는 답이 아니면 <u onclick="pm()">PM에게 문의</u></div>`
  :`<div class="pn" id="faqmiss">등록된 FAQ에서 답을 찾지 못했습니다.</div><div class="pb2" onclick="pm()">PM에게 문의 보내기</div><div class="ps">${E(PM_NOTE)}</div>`);p.style.display='block'}
function closePop(){$('pop').style.display='none'}
function ctxLabel(){const st=mstate();return [st.t].concat(D.filters.map(f=>st[f.key]).filter(Boolean)).join(' · ')}
function pm(){const p=$('pop');if(p.querySelector('.ok,.wait'))return;const b=p.querySelector('.bad');if(b)b.remove();
  p.insertAdjacentHTML('beforeend',`<div class="ps wait">보내는 중…</div>`);
  pmSend(lastQ,ctxLabel()).then(r=>r,e=>({ok:0,msg:'보내지 못했습니다 ('+e.message+'). 잠시 뒤 다시 눌러 주세요.'})).then(r=>{const w=p.querySelector('.wait');if(w)w.remove();
    p.insertAdjacentHTML('beforeend',`<div class="ps ${r.ok?'ok':'bad'}">${E(r.msg)}</div>`)})}
function ex(el){$('fq').value=el.textContent;ask()}

/* 2층 사례 상세 */
function bdItems(s,c){return (s.bd||[]).map((k,i)=>{const b=D.bd[k]||{title:k};return `<div class="bdi" onclick="nav('${mk('bd',{id:c.id,s:s.key,i})}')"><span class="no">${i+1}</span><span>${E(b.title)}</span><span class="sp"></span><span class="btn f">보기</span><span class="btn" onclick="event.stopPropagation();printBd(this.dataset.k)" data-k="${A(k)}">출력</span></div>`+(b.note?`<div class="bnote">${E(b.note)}</div>`:'')}).join('')}
function vcase(id){
  const c=D.cases.find(x=>String(x.id)===String(id));if(!c)return head(1)+`<div class="msg0">사례를 찾지 못했습니다.</div>`;
  const t=c.type,k=typeOf(t,c),s=D.sets.find(x=>x.key===t)||{bd:[]};
  const tk=D.talk[c.talk]||{title:'',speech:''},n=tk.speech.replace(/\s/g,'').length,sec=Math.round(n/5.6);
  const fq=(D.faq_map[c.talk]||[]).map(i=>D.faq[i]).filter(Boolean);
  const extra=D.sets.filter(x=>x.kind==='notes'&&x.bd&&x.bd.length);
  const solo=D.solo_types.includes(t);
  const kv=(solo?[['타겟 환자',c.target||c.pt],['상황',c.sit]]:[['상황',c.sit],['타겟 환자',c.target]]).concat([['한 일',c.did],['결과',c.res+(c.pred?' · '+c.pred:'')],['넓힌 방법',c.how||'-']]).filter(x=>x[1]);
  const dtl=(c.detail||[]).map(d=>{const L=d.ol?'ol':'ul';return `<div class="dtl${d.hl?' hl':''}"><b>${E(d.h)}</b><${L}>${(d.items||[]).map(x=>`<li>${E(x)}</li>`).join('')}</${L}></div>`}).join('');
  const pk=(D.packs||{})[t]||{},evk=(pk.ev_keys||[]).filter(k=>D.bd[k]&&D.bd[k].pages);
  const pack=evk.length&&pk.ev?`<div class="cd pk" id="pack"><div class="pkt"><b>${['근거 BD'].concat(extra.map(x=>x.title||x.key)).map(E).join(' + ')} 한번에</b><small>${evk.length}종 · ${pgs(evk)}쪽 · A4</small></div><span class="pkb"><button class="btn" data-t="${A(t)}" onclick="printPack(this)">한번에 출력</button>${dlA(pk.ev,'한번에 PDF 받기',' f')}</span></div>`:'';
  const cpb=w=>`<button class="btn cpy" data-w="${w}" onclick="copyCard(this)">복사</button>`;
  return head(1)+`<div class="dt" id="case" data-id="${c.id}"><div class="dh"><div class="l">${solo?'<div class="tgl">타겟 환자</div>':''}<h1>${E(solo?(c.target||c.pt||c.dept):(c.cshort||c.dept||c.cust))} <em>→ ${E(D.meta.product)}</em></h1><div><span class="bdg">${E(c.cust)}</span>${E(c.dept)}${c.dept?' · ':''}${E(t)}${k?' · '+E(k.name):''}</div>
  <div style="margin-top:6px">${c.tags.map(g=>`<span class="tag">${E(g)}</span>`).join('')}</div></div><div class="r${c.r_pred?' p':''}"><div>${c.r_from?`월 ${E(c.r_from)} → `:''}<span class="t">${E(numTxt(c.r_to))}</span></div><small>${E(c.r_note)}${c.r_pred?' · '+E(D.labels.pred):''}</small>${c.r_extra?`<small>${E(c.r_extra)}</small>`:''}</div></div>
  <div class="g2"><div><div class="cd" id="detail"><h2>사례 상세${cpb('detail')}</h2><div class="kv">${kv.map(x=>`<b>${E(x[0])}</b><div>${E(x[1])}</div>`).join('')}</div>${dtl}</div>
  ${pack}<div class="cd" id="bdlist"><h2>근거 BD <small>제목을 누르면 크게 열립니다 · 출력은 A4</small></h2>${bdItems(s,c)}</div>
  ${extra.map(x=>`<div class="cd"><h2>${E(x.title||x.key)} <small>${E(x.desc||'')}</small></h2>${bdItems(x,c)}</div>`).join('')}</div>
  <div><div class="cd" id="talk"><h2>표준대화 · 30초 스피치 <small>${E(tk.title)}</small>${cpb('talk')}</h2><div class="sp30">${E(tk.speech)}</div><div class="spn">공백 뺀 ${n}자 · 말하면 약 ${sec}초</div></div>
  <div class="cd" id="faqs"><h2>여기서 나오는 질문(FAQ) <small>사내 FAQ 원문 그대로</small>${cpb('faq')}</h2>${fq.map(f=>`<div class="fq"><b>${E(f.q)}</b><div>${E(f.a)}</div></div>`).join('')}</div></div></div></div>`}
/* 11-22 박본님: 항목마다 복사(사례 상세 · 표준대화 · FAQ) — 화면에 보이는 글 그대로, 줄 나눔만 정리 */
function copyText(c,w){const t=c.type,solo=D.solo_types.includes(t);
  if(w==='talk')return (D.talk[c.talk]||{}).speech||'';
  if(w==='faq')return (D.faq_map[c.talk]||[]).map(i=>D.faq[i]).filter(Boolean).map(f=>'Q. '+f.q+'\nA. '+f.a).join('\n\n');
  const L=[(solo?(c.target||c.pt||c.dept):(c.cshort||c.dept||c.cust))+' → '+D.meta.product,[c.cust,c.dept,t].filter(Boolean).join(' · ')];
  const kv=(solo?[['타겟 환자',c.target||c.pt],['상황',c.sit]]:[['상황',c.sit],['타겟 환자',c.target]]).concat([['한 일',c.did],['결과',c.res+(c.pred?' · '+c.pred:'')],['넓힌 방법',c.how||'-']]).filter(x=>x[1]);
  kv.forEach(x=>L.push(x[0]+': '+x[1]));
  (c.detail||[]).forEach(d=>{L.push('',`[${d.h}]`);(d.items||[]).forEach((x,i)=>L.push((d.ol?(i+1)+'. ':'- ')+x))});
  return L.join('\n')}
function copyCard(el){const c=D.cases.find(x=>String(x.id)===route().p.get('id'));if(!c)return;const s=copyText(c,el.dataset.w);
  const ok=()=>{el.textContent='복사됨 ✓';el.classList.add('f');setTimeout(()=>{el.textContent='복사';el.classList.remove('f')},1500)};
  const old=()=>{const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand('copy')}catch(e){}ta.remove();r?ok():alert('복사하지 못했습니다. 글을 길게 눌러 직접 복사해 주세요.')};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(ok,old);else old()}
function printPack(el){const pk=(D.packs||{})[el.dataset.t]||{};printKeys(el,(pk.ev_keys||[]).filter(k=>D.bd[k]&&D.bd[k].pages))}

/* 3층 근거 BD 보기 */
let VB=null;
function vbd(){
  const p=route().p,c=D.cases.find(x=>String(x.id)===p.get('id')),s=D.sets.find(x=>x.key===p.get('s'));
  if(!c||!s||!(s.bd||[]).length)return head(1)+`<div class="msg0">BD를 찾지 못했습니다.</div>`;
  const keys=s.bd,i=Math.min(Math.max(+p.get('i')||0,0),keys.length-1),key=keys[i],b=D.bd[key],pages=b.pages||1,pg=Math.min(Math.max(+p.get('p')||1,1),pages);
  VB={c,s,i,pg,keys};const first=i===0&&pg===1,last=i===keys.length-1&&pg===pages;
  return `<div class="vw" id="viewer" data-key="${A(key)}"><div class="vt"><button class="b" onclick="backTo('${mk('case',{id:c.id})}')">← 사례로</button><b>${E(b.title)}</b><span class="sp"></span><span class="pg">${pg} / ${pages}쪽</span><button class="b" onclick="printBd(this.dataset.k)" data-k="${A(key)}">출력</button><a class="b f" href="${A(bdPdfHref(key))}" download="${A(b.file||key)}.pdf" data-k="${A(key)}" onclick="return bdPdf(this)">PDF 받기</a></div>
  <div class="vb" id="vb"><button class="ar" onclick="step(-1)"${first?' disabled':''}>←</button><div class="ld" id="bdld"><i></i>근거 BD를 불러오는 중…<small>보안 확인 뒤 받아 오느라 몇 초 걸립니다</small></div><img id="bdimg" alt="${A(b.title)}" data-k="${A(key)}" data-p="${pg}" onload="this.dataset.ok='1';bdDone()" onerror="bdFail(this)"><button class="ar" onclick="step(1)"${last?' disabled':''}>→</button></div>
  <div class="vl">${keys.map((k,j)=>`<div class="${j===i?'on':''}" onclick="jump(${j})">${j+1}. ${E((D.bd[k]||{}).title||k)}</div>`).join('')}</div></div>`}
function bdDone(){const l=$('bdld');if(l)l.remove()}
function bdFail(el){if(el.dataset.ok==='0')return;el.dataset.ok='0';bdDone();el.insertAdjacentHTML('afterend','<span class=err>이미지를 불러오지 못했습니다</span>')}
function fillBd(){const el=$('bdimg');if(!el)return;bdImg(el.dataset.k,+el.dataset.p).then(u=>{el.src=u},()=>bdFail(el))} // 화면이 그 쪽을 열 때만 받는다
function goBd(i,pg){replace(mk('bd',{id:VB.c.id,s:VB.s.key,i,p:pg}))}
function step(d){if(!VB)return;let{i,pg,keys}=VB;const n=k=>(D.bd[k]||{}).pages||1;
  if(d>0){if(pg<n(keys[i]))pg++;else if(i<keys.length-1){i++;pg=1}else return}else{if(pg>1)pg--;else if(i>0){i--;pg=n(keys[i])}else return}goBd(i,pg)}
function jump(j){goBd(j,1)}
addEventListener('keydown',e=>{if(route().v!=='bd'||!VB)return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')backTo(mk('case',{id:VB.c.id}))});
let tx=null,ty=null;
addEventListener('touchstart',e=>{if(route().v!=='bd')return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1)},{passive:true});

/* 출력 — 그 BD만 A4로 */
function printBd(key){const b=D.bd[key];if(!b)return;const el=$('prn');
  Promise.all(Array.from({length:b.pages||1},(_,j)=>bdImg(key,j+1))).then(us=>{
    el.innerHTML=us.map(u=>`<img src="${A(u)}" alt="">`).join('');
    const im=[...el.querySelectorAll('img')];return Promise.all(im.map(x=>x.complete?0:new Promise(r=>{x.onload=x.onerror=r})))}).then(()=>window.print(),()=>alert('출력할 이미지를 불러오지 못했습니다.'))}
/* 1층 사례 맵 출력 — 사례 맵 쪽만, 또는 그 유형의 근거 BD까지 한 번에(A4). 거르기와 상관없이 그 유형 전체가 나온다 */
function prKeys(t,withBd){const cp=(D.case_pages||{})[t];if(!cp||!D.bd[cp]||!D.bd[cp].pages)return[];const s=D.sets.find(x=>x.key===t)||{};
  return [cp].concat(withBd?(s.bd||[]).filter(k=>D.bd[k]&&D.bd[k].pages):[])}
/* 11-22 박본님: 출력과 PDF 받기 둘 다 — 사례 맵만 / 근거 BD까지 각각 */
const pgs=k=>k.reduce((a,x)=>a+(D.bd[x].pages||1),0);
function dlA(key,label,cls){const b=D.bd[key];if(!b||!b.pages)return'';return `<a class="btn${cls||''}" href="${A(bdPdfHref(key))}" download="${A(b.file||key)}.pdf" data-k="${A(key)}" onclick="return bdPdf(this)">${label}</a>`}
function prBtns(t){const a=prKeys(t,0),b=prKeys(t,1),pk=(D.packs||{})[t]||{};if(!a.length)return'';
  const g=(lab,keys,wb,dk)=>`<span class="prg"><b>${lab} ${pgs(keys)}쪽</b><button class="btn" data-t="${A(t)}" onclick="printMap(this,${wb})">출력</button>${dlA(dk,'PDF 받기',' f')}</span>`;
  return `<span class="prs">${g('사례 맵만',a,0,a[0])}${b.length>a.length?g('근거 BD까지',b,1,pk.mapbd):''}</span>`}
function printMap(el,withBd){printKeys(el,prKeys(el.dataset.t,withBd))}
function printKeys(el,keys){if(el.dataset.busy)return;const jobs=[];keys.forEach(k=>{for(let j=1;j<=(D.bd[k].pages||1);j++)jobs.push([k,j])});if(!jobs.length)return;
  const label=el.textContent,pr=$('prn');let done=0;el.dataset.busy='1';el.textContent=`불러오는 중 0/${jobs.length}`;
  const us=new Array(jobs.length);let nx=0; // 11-22 검토관 🟡: 서버 요청은 3개씩(PDF 받기와 같은 방식 — 동시 실행 한도 보호)
  const wk=()=>nx<jobs.length?(j=>bdImg(jobs[j][0],jobs[j][1]).then(u=>{us[j]=u;el.textContent=`불러오는 중 ${++done}/${jobs.length}`}))(nx++).then(wk):Promise.resolve();
  Promise.all([wk(),wk(),wk()]).then(()=>us)
    .then(us=>{pr.innerHTML=us.map(u=>`<img src="${A(u)}" alt="">`).join('');const im=[...pr.querySelectorAll('img')];return Promise.all(im.map(x=>x.complete?0:new Promise(r=>{x.onload=x.onerror=r})))})
    .then(()=>window.print(),()=>alert('출력할 쪽을 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요.'))
    .then(()=>{delete el.dataset.busy;el.textContent=label})}

function render(){
  if(!D)return;const r=route();closePop();VB=null;
  document.title=D.meta.title;
  if(r.v==='case')$('app').innerHTML=vcase(r.p.get('id'));
  else if(r.v==='bd'){$('app').innerHTML=vbd();fillBd()}
  else{$('app').innerHTML=vmap();const q=r.p.get('q');if(q){$('fq').value=q;ask()}}
  window.scrollTo(0,0);
}
if(!location.hash)history.replaceState(null,'','#map');
loadData().then(d=>{D=d;render()}).catch(e=>{if(e&&e.gate)return;$('app').innerHTML=`<div class="msg0">자료를 불러오지 못했습니다 (${E(e.message)}). ${E(LOAD_HELP)}</div>`});
</script>
</body>
</html>
